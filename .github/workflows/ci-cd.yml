name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
 # 1. Code von GitHub laden
      - name: Code auschecken
        uses: actions/checkout@v4
 
 # 2. Set Up Python 
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'

 # Step 3: Install dependencies (if any)
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
# Step 4: Run tests
      - name: Run Python tests
        run: PYTHONPATH=. pytest

     

# 5. Login to a Docker registry/Github registery
     - name: Login to Docker Hub
       uses: docker/login-action@v3
       with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

 # 6. Docker Buildx initialisieren (erstellt eine echte Docker-Umgebung)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

 # 7. Docker-Image wirklich bauen (und Cache nutzen, falls vorhanden)
      - name: Docker-Container bauen (Build Test)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true # Wir wollen es hier nur testen, noch nicht in eine Registry hochladen
          tags: hazem9192/german-helper:latest
          # Hier übergeben wir die Secrets sicher an den Docker-Build:
          build-args: |
            POSTGRES_USER=${{ secrets.POSTGRES_USER }}
            POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
            POSTGRES_DB=${{ secrets.POSTGRES_DB }}
            DATABASE_URL=${{ secrets.DATABASE_URL }}
