name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # 1. Code von GitHub laden
      - name: Code auschecken
        uses: actions/checkout@v4

      # 2. Docker Buildx initialisieren (erstellt eine echte Docker-Umgebung)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. Docker-Image wirklich bauen (und Cache nutzen, falls vorhanden)
      - name: Docker-Container bauen (Build Test)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false # Wir wollen es hier nur testen, noch nicht in eine Registry hochladen
          load: true  # Lädt das Image in den lokalen Docker-Speicher des Runners zum Testen
          tags: german-helper:latest
          # Hier übergeben wir die Secrets sicher an den Docker-Build:
          build-args: |
            POSTGRES_USER=${{ secrets.POSTGRES_USER }}
            POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
            POSTGRES_DB=${{ secrets.POSTGRES_DB }}
            DATABASE_URL=${{ secrets.DATABASE_URL }}
